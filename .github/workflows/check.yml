# Two of the checks a clone opts into with `git config core.hooksPath .githooks`, run on every pull
# request whether or not its author's clone did (#180): the commit messages and the changed
# Markdown, over the pull request's own commits. Each check's self-test runs first, so a check
# that can no longer fail is caught here. The download hook's self-test runs with them (#194):
# scripts/ask-before-download.ps1 refuses in an agent session and checks nothing here, so this
# is the one place a pull request that breaks it goes red. The glossary check runs over the same
# commits, with its self-test (#200): no hook runs it, and it fails on an added line that uses a
# word GLOSSARY.md avoids and is not marked deliberate. The Markdown check's range and the
# glossary check's have three dots (#204): both scripts hand the range to `git diff`, where two
# dots would compare the two tips and judge a branch behind `main` on what `main` has changed
# since. The commit check's keeps two: it hands the range to `git rev-list`, where two dots are
# the branch's commits and three would add those of `main`. The Markdown check is handed a line
# limit of 100 (#209), as .githooks/pre-commit hands it one: without it the check reads no length.
#
# The self-tests of scripts/reword-commit.ps1 (#207) and scripts/pr-body.ps1 (#208) run with the
# others: a session runs those two scripts before a pull request exists, so nothing here runs
# the scripts themselves.
#
# The comment header of each tracked `scripts/*.ps1` is read for a line over 100 characters
# (#211), with that check's self-test among the others. It reads each of them and not the pull
# request's alone: a header has no range.
#
# scripts/absolute-words.ps1 (#219) has its self-test among the others and no step of its own:
# it lists lines for a session to walk before the pre-PR review, and has nothing to fail on.
#
# The self-test of the mod-cache hook's wiring runs with the others (#225):
# vendor/grado-factorio-tools/scripts/refuse-cd-into-mod-cache.ps1 -SelfTest -Settings
# .claude/settings.json. Its last case runs the command wired in that file, so a pull request
# whose wired command no longer reaches the script goes red here. On this runner it passes 36 of
# its 40 cases at tools pin e3b9ba8 and skips 4, each a Windows way of writing a path (measured
# 2026-10-12, run 38222599731); with a wrong file name in the wired path the last case failed
# and so did the check (run 38222794433).
#
# The shared body check, vendor/grado-factorio-tools/scripts/pr-body-check.ps1, runs on the pull
# request's body (#321), with its self-test among the others: it fails a body that cites a commit
# not on main, and a closing keyword outside a bare `Closes #N` line. The rebase merge rewrites
# every commit of the branch, so a body citing one cites a commit main never holds. The body
# reaches the script through the environment, never pasted into the command, as the tools
# repository's workflow hands it. `edited` is among the triggers so an edited body is checked
# again; it runs the other steps again too. The script refuses a shallow clone, and the whole
# history below is what lets it tell a commit on main from one that is not.
#
# The pull request's head is checked out, not the merge commit GitHub makes for it, so the range
# is the pull request's commits and no other. The whole history and the submodule come with it,
# or `origin/main..HEAD` is empty and the two shared checks, commit-check.ps1 and
# markdown-check.ps1 (#182), are missing. The range keeps the three commits of 2026-09-20 out,
# which fail the check and are left alone (CLAUDE.md).
#
# Nothing is installed: pwsh, git and sh are on the runner. The checkout action is the one thing
# fetched besides this repository and its submodule, pinned to a commit.
name: check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          submodules: true

      - name: Run the self-tests
        run: |
          pwsh -NoProfile -File vendor/grado-factorio-tools/scripts/commit-check.ps1 -SelfTest
          pwsh -NoProfile -File vendor/grado-factorio-tools/scripts/markdown-check.ps1 -SelfTest
          pwsh -NoProfile -File scripts/glossary-check.ps1 -SelfTest
          pwsh -NoProfile -File scripts/ask-before-download.ps1 -SelfTest
          pwsh -NoProfile -File scripts/reword-commit.ps1 -SelfTest
          pwsh -NoProfile -File scripts/pr-body.ps1 -SelfTest
          pwsh -NoProfile -File vendor/grado-factorio-tools/scripts/pr-body-check.ps1 -SelfTest
          pwsh -NoProfile -File scripts/header-length-check.ps1 -SelfTest
          pwsh -NoProfile -File scripts/absolute-words.ps1 -SelfTest
          pwsh -NoProfile -File vendor/grado-factorio-tools/scripts/refuse-cd-into-mod-cache.ps1 -SelfTest -Settings .claude/settings.json

      - name: Check the commit messages
        if: ${{ !cancelled() }}
        run: pwsh -NoProfile -File vendor/grado-factorio-tools/scripts/commit-check.ps1 -Range origin/main..HEAD

      - name: Check the changed Markdown
        if: ${{ !cancelled() }}
        run: pwsh -NoProfile -File vendor/grado-factorio-tools/scripts/markdown-check.ps1 -Range origin/main...HEAD -MaxLineLength 100

      - name: Check the added Markdown lines against the glossary
        if: ${{ !cancelled() }}
        run: pwsh -NoProfile -File scripts/glossary-check.ps1 -Range origin/main...HEAD

      - name: Check the scripts' comment headers for line length
        if: ${{ !cancelled() }}
        run: pwsh -NoProfile -File scripts/header-length-check.ps1 -All

      - name: Check the pull request body
        if: ${{ !cancelled() }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: pwsh
        run: ./vendor/grado-factorio-tools/scripts/pr-body-check.ps1 -Body "$env:PR_BODY"
